<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Round quota icon</title>
  <desc id="desc">A cobalt circular field with three white quota bars.</desc>
  <defs>
    <radialGradient id="base" cx="330" cy="260" r="760" gradientUnits="userSpaceOnUse"><stop stop-color="#A5F0FF"/><stop offset=".34" stop-color="#6CCAF4"/><stop offset=".68" stop-color="#526DE0"/><stop offset="1" stop-color="#27399F"/></radialGradient>
    <radialGradient id="violet" cx="820" cy="780" r="560" gradientUnits="userSpaceOnUse"><stop stop-color="#C28FF2" stop-opacity=".48"/><stop offset="1" stop-color="#C28FF2" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx="190" cy="190" r="420" gradientUnits="userSpaceOnUse"><stop stop-color="#E0FBFF" stop-opacity=".30"/><stop offset="1" stop-color="#E0FBFF" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><circle cx="512" cy="512" r="402"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#F4F6FF"/>
  <circle cx="512" cy="512" r="402" fill="url(#base)"/>
  <g clip-path="url(#round)"><circle cx="820" cy="780" r="560" fill="url(#violet)"/><circle cx="190" cy="190" r="420" fill="url(#cool)"/></g>
  <g fill="#FFFFFF"><rect x="328" y="364" width="360" height="68" rx="34"/><rect x="328" y="478" width="286" height="68" rx="34"/><rect x="328" y="592" width="212" height="68" rx="34"/></g>
</svg>
