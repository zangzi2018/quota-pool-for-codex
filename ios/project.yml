name: CodexAccounts
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  CodexAccounts:
    type: application
    platform: iOS
    sources:
      - CodexAccounts
      - path: AppIcon_Round.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexaccounts
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quota Pool
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Used to connect to your desktop companion or local relay
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon_Round
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [CodexAccountsTests, CodexAccountsUITests]
  CodexAccountsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CodexAccountsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CodexAccounts
  CodexAccountsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CodexAccountsUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CodexAccounts
