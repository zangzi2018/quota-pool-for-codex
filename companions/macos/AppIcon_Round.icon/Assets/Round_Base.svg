<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Round base color field</title>
  <desc id="desc">A cobalt and cyan circular color field.</desc>
  <defs>
    <radialGradient id="baseField" gradientUnits="userSpaceOnUse" cx="330" cy="260" r="760"><stop offset="0" stop-color="#A5F0FF"/><stop offset=".34" stop-color="#6CCAF4"/><stop offset=".68" stop-color="#526DE0"/><stop offset="1" stop-color="#27399F"/></radialGradient>
    <radialGradient id="violetGlow" gradientUnits="userSpaceOnUse" cx="820" cy="780" r="560"><stop offset="0" stop-color="#C28FF2" stop-opacity=".48"/><stop offset="1" stop-color="#C28FF2" stop-opacity="0"/></radialGradient>
    <radialGradient id="coolGlow" gradientUnits="userSpaceOnUse" cx="190" cy="190" r="420"><stop offset="0" stop-color="#E0FBFF" stop-opacity=".30"/><stop offset="1" stop-color="#E0FBFF" stop-opacity="0"/></radialGradient>
    <clipPath id="roundClip"><circle cx="512" cy="512" r="402"/></clipPath>
  </defs>
  <circle cx="512" cy="512" r="402" fill="url(#baseField)"/>
  <g clip-path="url(#roundClip)"><circle cx="820" cy="780" r="560" fill="url(#violetGlow)"/><circle cx="190" cy="190" r="420" fill="url(#coolGlow)"/></g>
</svg>
